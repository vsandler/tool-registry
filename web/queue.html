<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review queue · Tool Registry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="layout"></header>
  <main>
    <h1>Review queue</h1>
    <p class="intro">Tools in review, oldest first. Pick one to see its details.</p>
    <section id="content" aria-live="polite"></section>
  </main>
  <script type="module">
    import { renderLayout, onPersonaReady, loadOrExplain, h, when, renderProgress, renderFlags,
             renderAdvice, decideOrExplain, fill }
      from "./app.js";

    await renderLayout("queue");
    const content = document.getElementById("content");

    let tools = [];          // as the back end sent them, already in order
    let view = "mine";       // "mine" = Waiting on me, "all" = All in review
    let selectedId = null;
    let decided = null;      // the tool just decided, exactly as the back end answered

    onPersonaReady(async () => {
      view = "mine";
      selectedId = null;
      decided = null;
      await reload();
    });

    // If this persona can't open the queue, the back end's plain message is shown
    // here (by loadOrExplain) instead of a blank page or an error code.
    async function reload() {
      const loaded = await loadOrExplain("/admin/review-queue", content);
      if (loaded === null) return;
      tools = loaded;
      const keep = tools.some((t) => t.id === selectedId) || justDecided() !== null;
      if (!keep) selectedId = null;
      render();
    }

    // "Waiting on me" is the back end's answer for each tool, not a rule worked out here.
    function waitingOnMe() {
      return tools.filter((t) => t.my_action.can_decide);
    }

    function render(focusId = null) {
      const mine = waitingOnMe();
      const shown = view === "mine" ? mine : tools;
      const detail = h("section", { className: "tool-details panel", "aria-live": "polite" });

      fill(content,
        h("div", { className: "views", role: "group", "aria-label": "Which tools to show" },
          viewButton("mine", `Waiting on me (${mine.length})`),
          viewButton("all", `All in review (${tools.length})`)),
        h("div", { className: "queue-layout" }, listOrEmpty(shown), detail),
      );
      showDetail(detail);
      if (focusId !== null) content.querySelector(`[data-tool-id="${focusId}"]`)?.focus();
    }

    function viewButton(name, label) {
      return h("button", {
        type: "button",
        className: view === name ? "view current" : "view secondary",
        "aria-pressed": String(view === name),
        onClick: () => { view = name; render(); },
      }, label);
    }

    function listOrEmpty(shown) {
      if (shown.length) return h("ul", { className: "queue-list" }, shown.map(row));
      if (tools.length === 0) {
        return h("p", { className: "message status", role: "status" },
          "Nothing is in review right now.");
      }
      return h("div", { className: "queue-empty" },
        h("p", { className: "message status", role: "status" }, "Nothing is waiting on you."),
        h("button", { type: "button", className: "secondary",
                      onClick: () => { view = "all"; render(); } }, "Show all in review"));
    }

    // One tool: its name, who built it, when it was submitted, the step it's on, and
    // who must act next, all as the back end said.
    function row(tool) {
      const a = tool.my_action;
      const selected = tool.id === selectedId;
      return h("li", {},
        h("button", {
          type: "button",
          className: `queue-row${selected ? " selected" : ""}`,
          "data-tool-id": tool.id,
          "aria-current": selected ? "true" : null,
          onClick: () => {
            selectedId = tool.id;
            decided = null;
            render(tool.id);
            revealDetails();
          },
        },
          h("span", { className: "row-name" }, tool.name),
          h("span", { className: "meta" },
            `Built by ${tool.owner_name} · submitted ${when(tool.submitted_at)}`),
          h("span", {}, `Step ${a.step_position}: ${a.step_name}`),
          h("span", { className: a.can_decide ? "row-next mine" : "row-next" },
            a.can_decide ? "Waiting on you" : a.reason),
          tool.flagged ? h("span", { className: "badge" }, "Has rule flags") : null));
    }

    // On a narrow screen the details sit below the list, out of sight: scroll to them
    // and move focus to their heading. Worked out from where the two boxes are, so it
    // follows the stylesheet without a second copy of its breakpoint.
    function revealDetails() {
      const list = content.querySelector(".queue-list");
      const detail = content.querySelector(".tool-details");
      const heading = detail?.querySelector("h2");
      if (!list || !heading) return;
      const stacked = detail.getBoundingClientRect().top >= list.getBoundingClientRect().bottom;
      if (!stacked) return;
      const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      detail.scrollIntoView({ behavior: still ? "auto" : "smooth", block: "start" });
      heading.setAttribute("tabindex", "-1");
      heading.focus({ preventScroll: true });
    }

    // The tool just decided, if it's the one selected: shown from the decision's own
    // answer, so it stays on screen even after it leaves the queue.
    function justDecided() {
      return decided && decided.id === selectedId ? decided : null;
    }

    function showDetail(target) {
      const listed = tools.find((t) => t.id === selectedId) || null;
      const tool = justDecided() || listed;
      if (!tool) {
        fill(target, h("p", { className: "hint" }, "Pick a tool to see its details."));
        return;
      }
      fill(target,
        justDecided() ? confirmation(tool, listed === null) : null,
        h("h2", {}, tool.name),
        h("p", { className: "meta" },
          `Built by ${tool.owner_name} · submitted ${when(tool.submitted_at)}`),
        renderProgress(tool.steps, tool.my_action),
        tool.rejection ? rejectionNote(tool.rejection) : null,
        tool.description ? h("p", {}, tool.description) : null,
        h("h3", {}, "Template"),
        h("pre", { className: "template" }, tool.template),
        h("h3", {}, "Why it's built this way"),
        h("p", {}, tool.rationale || "No reason was recorded."),
        renderFlags(tool.checks),
        renderAdvice(tool.ai_review),
        decisionPanel(tool),
        historyList(tool.history),
      );
    }

    // The decision controls, built only from the back end's `my_action`: whether this
    // persona can decide, what deciding needs (`needs`) and what to pick from
    // (`choices`). Every check on what's picked or typed happens in the back end
    // (DECISIONS.md #12); its message appears next to the buttons or the comment box.
    function decisionPanel(tool) {
      const a = tool.my_action;
      const heading = h("h2", {}, "Your decision");
      if (!tool.my_action.can_decide) {
        return h("section", { className: "panel decision" }, heading,
          h("p", { className: "message status", role: "status" }, a.reason));
      }

      const choices = a.choices || {};
      const buttonsArea = h("div", { className: "form-message", "aria-live": "polite" });
      const commentArea = h("div", { id: `comment-error-${tool.id}`, className: "field-error" });
      let picker = null;
      let collect = () => ({});
      let approveLabel = "Approve";

      if (a.needs === "areas") {
        ({ picker, collect } = areaPicker(tool, choices.areas));
        approveLabel = "Approve and route";
      } else if (a.needs === "visibility") {
        ({ picker, collect } = publishPicker(tool, choices));
        approveLabel = "Approve and publish";
      }

      const commentId = `comment-${tool.id}`;
      const hintId = `${commentId}-hint`;
      const comment = h("textarea", { id: commentId, name: "comment", rows: "3",
                                      "aria-describedby": hintId });
      const commentField = h("div", { className: "field" },
        h("label", { for: commentId }, "Comment"),
        h("p", { id: hintId, className: "hint" },
          "Optional when approving. To reject, explain why in at least " +
          `${a.reject_comment_min} characters. The builder will see it.`),
        comment,
        commentArea);

      const approve = h("button", { type: "button" }, approveLabel);
      const reject = h("button", { type: "button", className: "secondary danger" }, "Reject");

      async function send(decision, extra) {
        for (const button of [approve, reject]) button.disabled = true;
        comment.removeAttribute("aria-invalid");
        comment.setAttribute("aria-describedby", hintId);
        const updated = await decideOrExplain(tool.id,
          { decision, comment: comment.value, ...extra }, { buttonsArea, commentArea });
        for (const button of [approve, reject]) button.disabled = false;
        if (updated === null) {
          // The back end said the comment is the problem: point the box at its message.
          if (commentArea.childElementCount) {
            comment.setAttribute("aria-invalid", "true");
            comment.setAttribute("aria-describedby", `${commentArea.id} ${hintId}`);
            comment.focus();
          }
          return;
        }
        await afterDecision(updated);
      }
      approve.addEventListener("click", () => send("approved", collect()));
      reject.addEventListener("click", () => send("rejected", {}));

      return h("section", { className: "panel decision" }, heading,
        h("p", {}, `Step ${a.step_position}: ${a.step_name}`),
        picker,
        commentField,
        h("div", { className: "buttons" }, approve, reject),
        buttonsArea);
    }

    // Route: a checkbox per area from the back end. The order is the order they're
    // ticked, shown as 1, 2, 3; unticking one moves the later ones up.
    function areaPicker(tool, areas) {
      const picked = [];
      const numbers = {};
      const labels = Object.fromEntries(areas.map((area) => [area.value, area.label]));
      const order = h("p", { className: "hint", "aria-live": "polite" });
      const showOrder = () => {
        for (const [value, number] of Object.entries(numbers)) {
          const place = picked.indexOf(value);
          number.textContent = place === -1 ? "" : String(place + 1);
        }
        order.textContent = picked.length
          ? `Review order: ${picked.map((value) => labels[value]).join(", then ")}.`
          : "No areas ticked yet.";
      };
      const items = areas.map((area) => {
        const id = `area-${tool.id}-${area.value}`;
        numbers[area.value] = h("span", { className: "order-number", "aria-hidden": "true" });
        const box = h("input", { type: "checkbox", id, value: area.value });
        box.addEventListener("change", () => {
          if (box.checked) picked.push(area.value);
          else picked.splice(picked.indexOf(area.value), 1);
          showOrder();
        });
        return h("li", {}, box, h("label", { for: id }, area.label), numbers[area.value]);
      });
      showOrder();
      const picker = h("fieldset", { className: "area-picker" },
        h("legend", {}, "Send it to these specialist areas, in the order you tick them"),
        h("p", { className: "hint" },
          "They review one after another. Untick an area to take it out; the rest move up."),
        h("ul", {}, items),
        order);
      return { picker, collect: () => ({ route_to: [...picked] }) };
    }

    // Publish: visibility and practice, starting from what the builder asked for. The
    // Practice box shows only for a visibility the back end says needs one.
    function publishPicker(tool, choices) {
      const visibility = h("select", { id: `visibility-${tool.id}`, name: "visibility" },
        choices.visibilities.map((v) => h("option", { value: v.value }, v.label)));
      visibility.value = choices.requested.visibility || "";
      const practice = h("select", { id: `practice-${tool.id}`, name: "practice" },
        h("option", { value: "" }, "Choose a practice…"),
        choices.practices.map((p) => h("option", { value: p }, p)));
      practice.value = choices.requested.practice || "";
      const practiceField = h("div", { className: "field" },
        h("label", { for: practice.id }, "Practice"), practice);
      const asksPractice = () => Boolean(
        (choices.visibilities.find((v) => v.value === visibility.value) || {}).asks_practice);
      const showPractice = () => { practiceField.hidden = !asksPractice(); };
      visibility.addEventListener("change", showPractice);
      showPractice();
      const picker = h("div", { className: "publish-picker" },
        h("p", { className: "hint" }, "Starts from what the builder asked for. Change it if needed."),
        h("div", { className: "field" },
          h("label", { for: visibility.id }, "Visibility"), visibility),
        practiceField);
      return { picker, collect: () => ({
        visibility: visibility.value,
        practice: asksPractice() ? (practice.value || null) : null,
      }) };
    }

    // After a decision: keep showing the tool as the back end now describes it
    // (`updated`), and reload the list, which it may have left.
    async function afterDecision(updated) {
      selectedId = updated.id;
      decided = updated;
      await reload();
      content.querySelector(".decision-done")?.focus();
    }

    function confirmation(tool, leftQueue) {
      return h("p", { className: "message ok decision-done", role: "status", tabindex: "-1" },
        `Decision recorded. This tool is now: ${tool.status_label}.`,
        leftQueue ? " It has left the queue." : "");
    }

    // Who rejected it, when, at which step and why: all from the back end.
    function rejectionNote(rejection) {
      return h("div", { className: "message error", role: "note" },
        h("strong", {}, "Rejected"),
        ` by ${rejection.by}, ${when(rejection.at)}, at step ${rejection.step_position} ` +
          `(${rejection.step_name}).`,
        h("p", {}, `Reason: ${rejection.reason}`));
    }

    // Every decision so far, oldest first, in readable words (`detail_label`).
    function historyList(history) {
      return h("section", { className: "panel" },
        h("h2", {}, "History"),
        history.length
          ? h("ol", { className: "history" }, history.map((entry) =>
              h("li", {},
                h("strong", {}, `${entry.approver_name} ${entry.decision}`),
                ` step ${entry.position} (${entry.step_name}), ${when(entry.decided_at)}.`,
                entry.detail_label ? ` ${entry.detail_label}.` : "",
                entry.comment ? h("p", { className: "step-comment" }, `“${entry.comment}”`) : null)))
          : h("p", {}, "No decisions yet."));
    }
  </script>
</body>
</html>
